<svg xmlns="http://www.w3.org/2000/svg" width="940" height="290" viewBox="0 0 940 290" role="img" aria-label="tech-stack.yaml terminal with David Vlez full stack skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150A21"/>
      <stop offset="0.5" stop-color="#1C0B2E"/>
      <stop offset="1" stop-color="#2A1014"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E95420" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#772953" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#772953" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E95420"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="940" height="290" rx="14"/>
    </clipPath>
    <style>
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2a { animation: drift2 11s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(160px, 40px); } to { transform: translate(780px, 260px); } }
      @keyframes drift2 { from { transform: translate(860px, 280px); } to { transform: translate(300px, 50px); } }
      .p { animation: float 7s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); opacity: 0.15; } to { transform: translateY(-12px); opacity: 0.75; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="940" height="290" fill="url(#bg)"/>
    <circle class="orb1" cx="0" cy="0" r="210" fill="url(#orb)"/>
    <circle class="orb2a" cx="0" cy="0" r="180" fill="url(#orb2)"/>
    <rect class="p" x="860" y="60" width="10" height="10" rx="3" fill="#39D353" style="animation-delay:0.6s"/>
    <rect class="p" x="68" y="236" width="10" height="10" rx="3" fill="#E95420" style="animation-delay:1.5s"/>
    <rect class="p" x="888" y="180" width="9" height="9" rx="3" fill="#F5A623" style="animation-delay:2.3s"/>
    <circle class="p" cx="92" cy="160" r="4" fill="#7EE787" style="animation-delay:1.1s"/>
  </g>

  <rect width="940" height="290" rx="14" fill="none" stroke="#3A1F4D" stroke-width="2"/>
  <rect x="0" y="0" width="940" height="36" rx="14" fill="#241338"/>
  <rect x="0" y="26" width="940" height="10" fill="#241338"/>
  <line x1="0" y1="36" x2="940" y2="36" stroke="#3A1F4D" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="18" r="6" fill="#27C93F"/>
  <text x="470" y="23" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#A2AAC3">david@velez-dev — ~/tech-stack.yaml</text>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="16" fill="#7EE787">
    <text x="72" y="72">$ <tspan fill="#C9D1D9" font-size="15">cat tech-stack.yaml</tspan></text>
  </g>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="15">
    <text x="72" y="110" fill="#772953">├─ </text><text x="118" y="110" fill="#F5A623" font-weight="700">◉ frontend:      </text><text x="284" y="110" fill="#C9D1D9">JavaScript · HTML · CSS · React</text>
    <text x="72" y="138" fill="#772953">├─ </text><text x="118" y="138" fill="#F5A623" font-weight="700">⚙ backend:       </text><text x="284" y="138" fill="#C9D1D9">Python · Django · FastAPI · Node.js</text>
    <text x="72" y="166" fill="#772953">├─ </text><text x="118" y="166" fill="#F5A623" font-weight="700">▣ databases:     </text><text x="284" y="166" fill="#C9D1D9">MySQL · PostgreSQL · MongoDB</text>
    <text x="72" y="194" fill="#772953">└─ </text><text x="118" y="194" fill="#F5A623" font-weight="700">☁ tools_devops:  </text><text x="284" y="194" fill="#C9D1D9">Docker · Git · GitHub Actions · Bash · Linux</text>
  </g>

  <rect x="72" y="214" width="800" height="1" fill="#3A1F4D"/>

  <text x="72" y="244" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#F5A623" font-weight="700">status<tspan font-weight="400" fill="#C9D1D9">: </tspan><tspan fill="#39D353">building</tspan></text>
  <text x="230" y="244" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#484F58">·</text>
  <text x="250" y="244" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#F5A623" font-weight="700">environment<tspan font-weight="400" fill="#C9D1D9">: </tspan><tspan fill="#7EE787">production</tspan></text>

  <text x="72" y="272" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#7EE787">$</text>
  <rect class="cur" x="92" y="259" width="9" height="16" fill="#39D353"/>
</svg>
