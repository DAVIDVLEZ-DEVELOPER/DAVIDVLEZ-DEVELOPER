<svg xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200" role="img" aria-label="Tux de Ubuntu comienzo los commits estilo Pac-Man">
  <defs>
    <g id="tux">
      <ellipse cx="0" cy="4" rx="30" ry="7" fill="#000000" opacity="0.4"/>
      <ellipse cx="-11" cy="2" rx="12" ry="6" fill="#F5A623"/>
      <ellipse cx="11" cy="2" rx="12" ry="6" fill="#F5A623"/>
