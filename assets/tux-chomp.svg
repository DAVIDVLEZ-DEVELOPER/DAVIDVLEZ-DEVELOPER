      <circle cx="10" cy="-71" r="3" fill="#111111"/>
      <path d="M 3 -62 L 25 -57 L 3 -53 Z" fill="#F5A623"/>
    </g>
    <style>
      .run { animation: run 7s linear infinite; }
      @keyframes run { from { transform: translateX(-100px); } to { transform: translateX(1000px); } }
      .waddle { transform-box: fill-box; transform-origin: 50% 92%; animation: waddle 0.45s ease-in-out infinite; }
      @keyframes waddle { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
      .pellet { animation: eat 7s linear infinite; }
      @keyframes eat { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 1; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

