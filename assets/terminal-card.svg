<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" role="img" aria-label="Terminal fastfetch con informacion de David Velez">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150A21"/>
      <stop offset="0.5" stop-color="#1C0B2E"/>
      <stop offset="1" stop-color="#2A1014"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E95420" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#772953" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#772953" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E95420"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="940" height="390" rx="14"/>
    </clipPath>
    <style>
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2a { animation: drift2 11s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(140px, 40px); } to { transform: translate(760px, 300px); } }
      @keyframes drift2 { from { transform: translate(860px, 340px); } to { transform: translate(320px, 60px); } }
      .p { animation: float 7s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); opacity: 0.15; } to { transform: translateY(-12px); opacity: 0.75; } }
      .wipe { transform-box: fill-box; transform-origin: center; animation: wipe 4s ease-in-out infinite alternate; }
      @keyframes wipe { from { transform: scaleX(0.25); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="940" height="390" fill="url(#bg)"/>
    <circle class="orb1" cx="0" cy="0" r="210" fill="url(#orb)"/>
    <circle class="orb2a" cx="0" cy="0" r="180" fill="url(#orb2)"/>
    <rect class="p" x="856" y="70" width="10" height="10" rx="3" fill="#39D353" style="animation-delay:0.6s"/>
    <rect class="p" x="72" y="318" width="10" height="10" rx="3" fill="#E95420" style="animation-delay:1.5s"/>
    <rect class="p" x="884" y="252" width="9" height="9" rx="3" fill="#F5A623" style="animation-delay:2.3s"/>
    <circle class="p" cx="90" cy="200" r="4" fill="#7EE787" style="animation-delay:1.1s"/>
  </g>

  <rect width="940" height="390" rx="14" fill="none" stroke="#3A1F4D" stroke-width="2"/>
  <rect x="0" y="0" width="940" height="36" rx="14" fill="#241338"/>
  <rect x="0" y="26" width="940" height="10" fill="#241338"/>
  <line x1="0" y1="36" x2="940" y2="36" stroke="#3A1F4D" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="18" r="6" fill="#27C93F"/>
  <text x="470" y="23" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#A2AAC3">david@velez-dev — fastfetch</text>

  <text x="100" y="92" font-family="'Cascadia Code','Consolas',monospace" font-size="18" font-weight="700" fill="#39D353">david<tspan fill="#F5A623">@velez-dev</tspan></text>
  <rect class="wipe" x="100" y="106" width="210" height="5" rx="2.5" fill="url(#rule)"/>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="15">
    <text x="100" y="150" font-weight="700" fill="#F5A623">Formación<tspan font-weight="400" fill="#C9D1D9">: SENA · ADSO · Sexto trimestre</tspan></text>
    <text x="100" y="176" font-weight="700" fill="#F5A623">Rol<tspan font-weight="400" fill="#C9D1D9">: Full Stack Developer</tspan></text>
    <text x="100" y="202" font-weight="700" fill="#F5A623">Lenguajes<tspan font-weight="400" fill="#C9D1D9">: JavaScript · Java · Python</tspan></text>
    <text x="100" y="228" font-weight="700" fill="#F5A623">Backend<tspan font-weight="400" fill="#C9D1D9">: Node.js · Express · Django · FastAPI</tspan></text>
    <text x="100" y="254" font-weight="700" fill="#F5A623">Datos<tspan font-weight="400" fill="#C9D1D9">: PostgreSQL · MySQL · MongoDB</tspan></text>
    <text x="100" y="280" font-weight="700" fill="#F5A623">DevOps<tspan font-weight="400" fill="#C9D1D9">: Docker · Kubernetes · Git</tspan></text>
    <text x="100" y="306" font-weight="700" fill="#F5A623">Email<tspan font-weight="400" fill="#E95420">: daviidvp228@gmail.com</tspan></text>
    <text x="100" y="332" font-weight="700" fill="#F5A623">Ubicación<tspan font-weight="400" fill="#C9D1D9">: Medellín, Colombia · Abierto a oportunidades</tspan></text>
  </g>

  <text x="100" y="364" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#A2AAC3">$</text>
  <rect class="cur" x="120" y="351" width="9" height="16" fill="#39D353"/>
</svg>
