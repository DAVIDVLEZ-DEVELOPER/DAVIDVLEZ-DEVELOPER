<svg xmlns="http://www.w3.org/2000/svg" width="470" height="190" viewBox="0 0 470 190" role="img" aria-label="Proyecto Architect Tower Defense Dockerized">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#772953"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79C0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79C0FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#79C0FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="470" height="190" rx="14"/></clipPath>
    <style>
      .shine { animation: sweep 4s linear infinite; animation-delay: 2s; }
      @keyframes sweep { from { transform: translateX(-150px); } to { transform: translateX(470px); } }
    </style>
  </defs>
  <rect width="470" height="190" rx="14" fill="#161B22"/>
  <rect width="470" height="190" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="150" height="3" fill="url(#shine)"/></g>

  <rect x="24" y="24" width="52" height="52" rx="14" fill="#21262D" stroke="#58A6FF" stroke-opacity="0.6"/>
  <text x="50" y="57" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="17" font-weight="700" fill="#79C0FF">AT</text>
  <text x="92" y="47" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F6FC">Architect Tower Defense</text>
  <text x="92" y="70" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="12" fill="#8B949E">DevOps &amp; Software Architecture Game</text>

  <text x="24" y="114" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#A2AAC3">Juego containerizado con Docker: laboratorio</text>
  <text x="24" y="134" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#A2AAC3">de arquitectura de software y prácticas DevOps.</text>

  <rect x="24" y="152" width="58" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="53" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">Docker</text>
  <rect x="90" y="152" width="62" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="121" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">DevOps</text>
  <rect x="160" y="152" width="82" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="201" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">JavaScript</text>
</svg>
