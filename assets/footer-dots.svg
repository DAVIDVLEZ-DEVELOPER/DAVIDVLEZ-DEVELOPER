<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76" role="img" aria-label="David Velez 2026">
  <defs>
    <style>
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1000" height="76" rx="14" fill="#0D1117"/>
  <rect width="1000" height="76" rx="14" fill="none" stroke="#30363D" stroke-width="2"/>

  <text x="500" y="32" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#8B949E">David Vélez · Tecnólogo ADSO · Medellín, Colombia · 2026<tspan class="blink" fill="#E95420">_</tspan></text>

  <g transform="translate(440,50)">
    <rect class="pulse" x="0" y="0" width="10" height="10" rx="2" fill="#E95420" style="animation-delay:0s"/>
    <rect class="pulse" x="20" y="0" width="10" height="10" rx="2" fill="#F5A623" style="animation-delay:0.15s"/>
    <rect class="pulse" x="40" y="0" width="10" height="10" rx="2" fill="#39D353" style="animation-delay:0.3s"/>
    <rect class="pulse" x="60" y="0" width="10" height="10" rx="2" fill="#7EE787" style="animation-delay:0.45s"/>
    <rect class="pulse" x="80" y="0" width="10" height="10" rx="2" fill="#58A6FF" style="animation-delay:0.6s"/>
    <rect class="pulse" x="100" y="0" width="10" height="10" rx="2" fill="#79C0FF" style="animation-delay:0.75s"/>
    <rect class="pulse" x="120" y="0" width="10" height="10" rx="2" fill="#F5A623" style="animation-delay:0.9s"/>
    <rect class="pulse" x="140" y="0" width="10" height="10" rx="2" fill="#E95420" style="animation-delay:1.05s"/>
    <rect class="pulse" x="160" y="0" width="10" height="10" rx="2" fill="#39D353" style="animation-delay:1.2s"/>
    <rect class="pulse" x="180" y="0" width="10" height="10" rx="2" fill="#58A6FF" style="animation-delay:1.35s"/>
    <rect class="pulse" x="200" y="0" width="10" height="10" rx="2" fill="#772953" style="animation-delay:1.5s"/>
    <rect class="pulse" x="220" y="0" width="10" height="10" rx="2" fill="#E95420" style="animation-delay:1.65s"/>
  </g>
</svg>
