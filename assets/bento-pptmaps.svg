<svg xmlns="http://www.w3.org/2000/svg" width="470" height="190" viewBox="0 0 470 190" role="img" aria-label="Proyecto PPTMaps movilidad urbana">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7EE787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7EE787" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="470" height="190" rx="14"/></clipPath>
    <style>
      .shine { animation: sweep 4s linear infinite; animation-delay: 1s; }
      @keyframes sweep { from { transform: translateX(-150px); } to { transform: translateX(470px); } }
    </style>
  </defs>
  <rect width="470" height="190" rx="14" fill="#161B22"/>
  <rect width="470" height="190" rx="14" fill="none" stroke="url(#g)" stroke-width="1.5"/>
  <g clip-path="url(#clip)"><rect class="shine" x="0" y="0" width="150" height="3" fill="url(#shine)"/></g>

  <rect x="24" y="24" width="52" height="52" rx="14" fill="#21262D" stroke="#39D353" stroke-opacity="0.6"/>
  <text x="50" y="57" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="17" font-weight="700" fill="#7EE787">PM</text>
  <text x="92" y="47" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" font-weight="700" fill="#F0F6FC">PPTMaps — Movilidad Urbana</text>
  <text x="92" y="70" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="12" fill="#8B949E">Visualización de datos del Valle de Aburrá</text>

  <text x="24" y="114" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#A2AAC3">Integra datos de movilidad (SIATA y MEData)</text>
  <text x="24" y="134" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="13" fill="#A2AAC3">y los muestra en tiempo real sobre el mapa.</text>

  <rect x="24" y="152" width="82" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="65" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">JavaScript</text>
  <rect x="114" y="152" width="50" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="139" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">APIs</text>
  <rect x="172" y="152" width="56" height="24" rx="12" fill="#21262D" stroke="#30363D"/>
  <text x="200" y="168" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="11.5" fill="#8B949E">Datos</text>
</svg>
