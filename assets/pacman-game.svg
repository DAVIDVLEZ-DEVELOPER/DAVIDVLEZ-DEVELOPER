<svg xmlns="http://www.w3.org/2000/svg" width="940" height="220" viewBox="0 0 940 220" role="img" aria-label="Mapache estilo Pac-Man recogiendo mis commits">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#772953"/>
      <stop offset="1" stop-color="#E95420"/>
    </linearGradient>
    <g id="racc-head">
      <ellipse cx="-2" cy="29" rx="26" ry="6" fill="#000000" opacity="0.35"/>
      <path d="M -26 -10 C -46 -18 -50 -36 -44 -50" stroke="#484F58" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M -26 -10 C -46 -18 -50 -36 -44 -50" stroke="#C9D1D9" stroke-width="12" stroke-dasharray="6 8" fill="none"/>
      <circle cx="-44" cy="-52" r="4.5" fill="#E6E9EE"/>
      <path d="M -18 -24 L -26 -44 L -6 -32 Z" fill="#6E7681"/>
      <path d="M -16 -27 L -21 -39 L -8 -31 Z" fill="#B0B8C1"/>
      <path d="M 8 -28 L 14 -48 L 26 -34 Z" fill="#6E7681"/>
      <path d="M 10 -31 L 14 -43 L 23 -35 Z" fill="#B0B8C1"/>
      <circle r="31" fill="#8B949E"/>
      <path d="M -28 -8 Q -8 -19 10 -15 Q 24 -11 26 -1 Q 22 8 2 9 Q -18 9 -28 -1 Z" fill="#21262D"/>
      <ellipse cx="8" cy="-5" rx="8" ry="6.5" fill="#F0F6FC"/>
      <circle cx="11" cy="-5" r="3.1" fill="#0D1117"/>
      <circle cx="12.1" cy="-6.3" r="1" fill="#FFFFFF"/>
      <ellipse cx="17" cy="13" rx="13" ry="9" fill="#C9D1D9"/>
      <path d="M 25 9 L 35 6 M 25 12 L 36 12 M 25 15 L 35 18" stroke="#6E7681" stroke-width="0.9" opacity="0.7" fill="none"/>
      <path class="mouth" d="M 0 1 L 31 -9 A 31 31 0 0 1 31 11 Z" fill="#0D1117"/>
      <ellipse cx="30" cy="-2" rx="4.2" ry="3.4" fill="#21262D" stroke="#6E7681" stroke-width="0.7"/>
    </g>
    <g id="ghost">
      <path d="M -15 13 L -15 -1 A 15 15 0 0 1 15 -1 L 15 13 L 10 8 L 5 13 L 0 8 L -5 13 L -10 8 Z"/>
      <ellipse cx="-5.5" cy="-3" rx="5" ry="6" fill="#FFFFFF"/>
      <ellipse cx="5.5" cy="-3" rx="5" ry="6" fill="#FFFFFF"/>
      <circle cx="-3.5" cy="-2.5" r="2.4" fill="#1C0B2E"/>
      <circle cx="7.5" cy="-2.5" r="2.4" fill="#1C0B2E"/>
    </g>
    <g id="life">
      <circle r="6.5" fill="#8B949E"/>
      <path d="M -4.5 -4.5 L -6.5 -9.5 L -1 -6.5 Z" fill="#6E7681"/>
      <path d="M 4.5 -4.5 L 6.5 -9.5 L 1 -6.5 Z" fill="#6E7681"/>
      <rect x="-5.5" y="-2.5" width="11" height="3.5" rx="1.75" fill="#21262D"/>
      <circle cx="-2.2" cy="-0.8" r="1.2" fill="#FFFFFF"/>
      <circle cx="2.2" cy="-0.8" r="1.2" fill="#FFFFFF"/>
    </g>
    <style>
      .run { animation: run 7s linear infinite; }
      @keyframes run { from { transform: translateX(-110px); } to { transform: translateX(1010px); } }
      .waddle { transform-box: fill-box; transform-origin: 50% 92%; animation: waddle 0.4s ease-in-out infinite; }
      @keyframes waddle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
      .mouth { transform-box: fill-box; transform-origin: 0% 50%; animation: chomp 0.4s ease-in-out infinite; }
      @keyframes chomp { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
      .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 0.85s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .pellet { animation: eat 7s linear infinite; }
      @keyframes eat { 0% { opacity: 0; } 8% { opacity: 1; } 100% { opacity: 1; } }
      .pulse { animation: pulse 0.7s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="940" height="220" rx="14" fill="#0D1117"/>
  <rect width="940" height="220" rx="14" fill="none" stroke="#30363D" stroke-width="2"/>
  <rect x="0" y="0" width="940" height="34" rx="14" fill="#161B22"/>
  <rect x="0" y="24" width="940" height="10" fill="#161B22"/>
  <line x1="0" y1="34" x2="940" y2="34" stroke="#30363D" stroke-width="1"/>
  <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="6" fill="#27C93F"/>
  <text x="84" y="22" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#8B949E">david@devbox: ~/contribuciones</text>
  <text x="922" y="22" text-anchor="end" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#39D353">● grabando</text>

  <g font-family="'Cascadia Code','Consolas',monospace" font-size="14" font-weight="700">
    <text x="110" y="64" fill="#8B949E">SCORE <tspan fill="#F5A623">001200</tspan></text>
    <text x="300" y="64" fill="#8B949E">HI <tspan fill="#E95420">009999</tspan></text>
    <text x="470" y="64" fill="#8B949E">LIVES</text>
    <use href="#life" x="534" y="58"/>
    <use href="#life" x="552" y="58"/>
    <use href="#life" x="570" y="58"/>
    <text x="640" y="64" fill="#8B949E">NIVEL <tspan fill="#39D353">SEXTO</tspan></text>
  </g>

  <text x="24" y="96" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#8B949E">$ <tspan fill="#39D353">git commit -m</tspan> "shipping features" <tspan fill="#E95420">▊</tspan></text>

  <g fill="none" stroke-linecap="round" opacity="0.55">
    <line x1="50" y1="114" x2="890" y2="114" stroke="url(#wall)" stroke-width="3"/>
    <line x1="50" y1="176" x2="890" y2="176" stroke="url(#wall)" stroke-width="3"/>
  </g>
  <g fill="none" stroke-linecap="round" opacity="0.4" stroke="url(#wall)" stroke-width="3">
    <line x1="130" y1="176" x2="130" y2="162"/>
    <line x1="250" y1="114" x2="250" y2="128"/>
    <line x1="370" y1="176" x2="370" y2="162"/>
    <line x1="490" y1="114" x2="490" y2="128"/>
    <line x1="610" y1="176" x2="610" y2="162"/>
    <line x1="730" y1="114" x2="730" y2="128"/>
  </g>

  <g fill="#F5E6C8">
    <circle class="pellet" cx="110" cy="145" r="4.5" style="animation-delay:1.21s"/>
    <circle class="pellet" cx="160" cy="145" r="4.5" style="animation-delay:1.53s"/>
    <circle class="pellet" cx="210" cy="145" r="4.5" style="animation-delay:1.84s"/>
    <circle class="pellet" cx="260" cy="145" r="4.5" style="animation-delay:2.15s"/>
    <circle class="pellet" cx="310" cy="145" r="4.5" style="animation-delay:2.46s"/>
    <circle class="pellet" cx="360" cy="145" r="4.5" style="animation-delay:2.78s"/>
    <circle class="pellet" cx="410" cy="145" r="4.5" style="animation-delay:3.09s"/>
    <circle class="pellet" cx="460" cy="145" r="4.5" style="animation-delay:3.40s"/>
    <circle class="pellet" cx="510" cy="145" r="4.5" style="animation-delay:3.71s"/>
    <circle class="pellet" cx="560" cy="145" r="4.5" style="animation-delay:4.03s"/>
    <circle class="pellet" cx="610" cy="145" r="4.5" style="animation-delay:4.34s"/>
    <circle class="pellet" cx="660" cy="145" r="4.5" style="animation-delay:4.65s"/>
    <circle class="pellet" cx="710" cy="145" r="4.5" style="animation-delay:4.96s"/>
    <circle class="pellet" cx="760" cy="145" r="4.5" style="animation-delay:5.28s"/>
    <circle class="pellet" cx="810" cy="145" r="4.5" style="animation-delay:5.59s"/>
  </g>
  <g class="pellet" style="animation-delay:5.90s">
    <circle class="pulse" cx="860" cy="145" r="9" fill="#E95420"/>
  </g>

  <g transform="translate(0,145)">
    <g class="run">
      <g class="waddle">
        <use href="#racc-head" transform="scale(0.85)"/>
      </g>
      <g transform="translate(-150,8)">
        <g class="bob">
          <use href="#ghost" fill="#772953" transform="scale(0.85)"/>
        </g>
      </g>
      <g transform="translate(-290,8)">
        <g class="bob" style="animation-delay:0.4s">
          <use href="#ghost" fill="#F5A623" transform="scale(0.85)"/>
        </g>
      </g>
    </g>
  </g>

  <text x="24" y="204" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#484F58">commits hoy: 12 · racha: 14 días · cazando bugs</text>
  <rect class="cur" x="400" y="192" width="9" height="15" fill="#39D353"/>
</svg>
