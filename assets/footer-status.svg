<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="David Velez status bar">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D33"/>
      <stop offset="0.55" stop-color="#0E2438"/>
      <stop offset="1" stop-color="#0B1D33"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="0.55" stop-color="#48CAE4"/>
      <stop offset="1" stop-color="#90E0EF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fClip">
      <rect x="8" y="8" width="984" height="48" rx="12"/>
    </clipPath>
    <style>
      .ui { font-family: 'Inter','Segoe UI',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <g clip-path="url(#fClip)">
    <rect x="8" y="8" width="984" height="48" fill="url(#fbg)"/>
    <circle cx="930" cy="32" r="120" fill="url(#fglow)"/>

    <rect x="24" y="18" width="28" height="28" rx="8" fill="#0F2F4A" stroke="#1B3A5C"/>
    <text x="38" y="36" class="mono" font-size="10" fill="#48CAE4" text-anchor="middle">&lt;/&gt;</text>

    <text x="64" y="31" class="ui" font-size="12.5" font-weight="700" fill="#E2E8F0">DAVID VELEZ</text>
    <text x="64" y="45" class="ui" font-size="8.5" fill="#90E0EF" letter-spacing="1.3">FULL STACK DEVELOPER</text>

    <text x="500" y="37" class="ui" font-size="10" fill="#7C97B3" text-anchor="middle">Software is art + engineering.</text>

    <circle cx="792" cy="28" r="3.5" fill="#2EE59D" class="pulse"/>
    <text x="802" y="32" class="ui" font-size="9.5" fill="#2EE59D">open to work</text>
    <text x="802" y="44" class="ui" font-size="8.5" fill="#5B7A99">Medellín, CO</text>

    <text x="960" y="36" class="mono" font-size="9.5" fill="#5B7A99" text-anchor="end">2026</text>
  </g>

  <rect x="8" y="8" width="984" height="2" rx="1" fill="url(#fline)"/>
  <rect x="8" y="8" width="984" height="48" rx="12" fill="none" stroke="#1B3A5C"/>
</svg>
