<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="David Velez - Tecnologo ADSO y Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150A21"/>
      <stop offset="0.5" stop-color="#1C0B2E"/>
      <stop offset="1" stop-color="#2A1014"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E95420" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#772953" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#772953" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E95420"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <g id="tux">
      <ellipse cx="0" cy="4" rx="30" ry="7" fill="#000000" opacity="0.35"/>
      <ellipse cx="-11" cy="2" rx="12" ry="6" fill="#F5A623"/>
      <ellipse cx="11" cy="2" rx="12" ry="6" fill="#F5A623"/>
      <ellipse cx="-24" cy="-40" rx="7" ry="17" fill="#232323" stroke="#55505A" stroke-width="1" transform="rotate(18 -24 -40)"/>
      <ellipse cx="24" cy="-40" rx="7" ry="17" fill="#232323" stroke="#55505A" stroke-width="1" transform="rotate(-18 24 -40)"/>
      <ellipse cx="0" cy="-34" rx="27" ry="34" fill="#232323" stroke="#55505A" stroke-width="1.5"/>
      <ellipse cx="3" cy="-30" rx="18" ry="26" fill="#F4F1EA"/>
      <circle cx="0" cy="-66" r="21" fill="#232323" stroke="#55505A" stroke-width="1"/>
      <ellipse cx="-6" cy="-72" rx="6.5" ry="7.5" fill="#FFFFFF"/>
      <ellipse cx="8" cy="-72" rx="6.5" ry="7.5" fill="#FFFFFF"/>
      <circle cx="-4" cy="-71" r="3" fill="#111111"/>
      <circle cx="10" cy="-71" r="3" fill="#111111"/>
      <path d="M 3 -62 L 25 -57 L 3 -53 Z" fill="#F5A623"/>
    </g>
    <style>
      .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 13s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(60px, 40px); } to { transform: translate(700px, 170px); } }
      @keyframes drift2 { from { transform: translate(880px, 230px); } to { transform: translate(420px, 60px); } }
      .p { animation: float 6s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); opacity: 0.2; } to { transform: translateY(-16px); opacity: 0.9; } }
      .wipe { transform-box: fill-box; transform-origin: center; animation: wipe 4s ease-in-out infinite alternate; }
      @keyframes wipe { from { transform: scaleX(0.2); } to { transform: scaleX(1); } }
      .dash { stroke-dasharray: 16 12; animation: dash 4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -56; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="none" stroke="#3A1F4D" stroke-width="2"/>

  <circle class="orb1" cx="0" cy="0" r="230" fill="url(#orb)"/>
  <circle class="orb2" cx="0" cy="0" r="200" fill="url(#orb2)"/>

  <g stroke="#E95420" stroke-width="2" fill="none" opacity="0.35">
    <path class="dash" d="M 0 262 H 240 L 270 232 H 520"/>
    <path class="dash" d="M 1000 44 H 780 L 750 74 H 540"/>
  </g>

  <g fill="#39D353">
    <rect class="p" x="118" y="66" width="12" height="12" rx="3" style="animation-delay:0.2s;animation-duration:7s"/>
    <rect class="p" x="868" y="92" width="12" height="12" rx="3" style="animation-delay:1.4s;animation-duration:6s"/>
  </g>
  <g fill="#E95420">
    <rect class="p" x="196" y="216" width="12" height="12" rx="3" style="animation-delay:0.9s;animation-duration:8s"/>
    <rect class="p" x="744" y="52" width="12" height="12" rx="3" style="animation-delay:2.1s;animation-duration:6.5s"/>
  </g>
  <rect class="p" x="64" y="140" width="10" height="10" rx="3" fill="#58A6FF" style="animation-delay:1.7s;animation-duration:7.5s"/>
  <rect class="p" x="924" y="196" width="10" height="10" rx="3" fill="#F5A623" style="animation-delay:0.5s;animation-duration:6.8s"/>
  <circle class="p" cx="272" cy="48" r="5" fill="#C7562B" style="animation-delay:2.6s;animation-duration:7.2s"/>
  <circle class="p" cx="700" cy="252" r="5" fill="#7EE787" style="animation-delay:1.1s;animation-duration:6.4s"/>

  <text x="86" y="172" font-family="'Cascadia Code','Consolas',monospace" font-size="76" font-weight="700" fill="#E95420" opacity="0.16">&lt;/&gt;</text>

  <text x="500" y="142" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="3">DAVID VÉLEZ</text>
  <rect class="wipe" x="330" y="160" width="340" height="6" rx="3" fill="url(#bar)"/>
  <text x="500" y="206" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="23" fill="#CBD5E1">Tecnólogo ADSO · Full Stack Developer</text>
  <text x="500" y="242" text-anchor="middle" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="16" fill="#8B949E">SENA · Sexto Trimestre · Medellín, Colombia</text>
  <rect class="blink" x="742" y="230" width="9" height="16" fill="#E95420"/>

  <use href="#tux" transform="translate(892,272) scale(1.15)"/>
</svg>
